<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />
    <title>2pixelshorts Studio</title>
    <script>
      // Apply the persisted HeroUI color mode before first paint (no flash).
      // Matches `useTheme` from @heroui/react (storage key `heroui-theme`).
      (function () {
        try {
          var stored = localStorage.getItem("heroui-theme") || "light";
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.classList.add("light");
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      /* App `--background` in hex, painted before CSS loads (no flash). */
      html {
        background-color: #f9f9fa;
      }
      html.dark {
        background-color: #0e0e10;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
